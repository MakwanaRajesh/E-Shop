services:
  - type: web
    name: nexus-eshop-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: EShopAPI
      - key: Jwt__Audience
        value: EShopClient
      - key: FRONTEND_URL
        sync: false
